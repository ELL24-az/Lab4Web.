
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Layout Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Layout Sederhana</h1>
</header>

<nav>
    <a href="home.html">Home</a>
    <a href="artikel.html">Artikel</a>
    <a href="about.html">About</a>
    <a href="kontak.html" class="active">Kontak</a>
</nav>

<section id="hero">
    <h1>Contact Us</h1>
    <p>Silakan isi formulir berikut untuk menghubungi kami.</p>
</section>

<section class="page-content">

    <div class="contact-info">
        <h2>Hubungi Saya</h2>
        <p>
            Punya pertanyaan, saran, atau ingin berdiskusi?
            Silakan kirim pesan melalui formulir di bawah ini.
        </p>
    </div>

    <form class="contact-form" action="#" method="post">

        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama"
               placeholder="Masukkan nama lengkap" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="contoh@email.com" required>

        <label for="subjek">Subjek</label>
        <input type="text" id="subjek" name="subjek"
               placeholder="Masukkan subjek pesan" required>

        <label for="pesan">Pesan</label>
        <textarea id="pesan" name="pesan" rows="6"
                  placeholder="Tuliskan pesan kamu..." required></textarea>

        <button type="submit">Kirim Pesan</button>

    </form>

</section>

<footer>
    <p>&copy; 2026 - Universitas Pelita Bangsa</p>
</footer>

</body>
</html>
